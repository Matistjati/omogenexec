syntax = "proto3";

package omogen.runner;

import "api/program.proto";

enum EvaluationType {
  EVALUATION_TYPE_UNSPECIFIED = 0;
  // An input file is passed to a program and its output is compared with an
  // output file (possibly through an extra validator program).
  SIMPLE = 1;
  // The program communicates with a validator program which is given the
  // input and output files.
  INTERACTIVE = 2;
}

message EvaluationPlan {
  EvaluationType plan_type = 1;
  TestGroup root_group = 2;

  CompiledProgram program = 3;
  int32 time_limit_ms = 5;
  int32 mem_limit_mib = 6;

  CompiledProgram validator = 4;
  int32 validator_time_limit_ms = 7;
  int32 validator_mem_limit_mib = 8;
  bool scoring_validator = 9;

  CompiledProgram grader = 10;
}

enum ScoringMode {
  SCORING_MODE_UNSPECIFIED = 0;
  MIN = 1;
  MAX = 2;
  AVG = 3;
  SUM = 4;
}

enum VerdictMode {
  VERDICT_MODE_UNSPECIFIED = 0;
  WORST_ERROR = 1;
  FIRST_ERROR = 2;
  ALWAYS_ACCEPT = 3;
}

message TestGroup {
  string name = 3;

  // Contents
  repeated TestCase cases = 1;
  repeated TestGroup groups = 2;
  bool break_on_fail = 7;

  // Grading
  double accept_score = 4;
  double reject_score = 5;
  ScoringMode scoring_mode = 8;
  VerdictMode verdict_mode = 9;
  bool accept_if_any_accepted = 10;
  bool ignore_sample = 11;
  bool custom_grading = 12;
  repeated string grader_flags = 13;

  // Validation
  repeated string output_validator_flags = 6;
}

message TestCase {
  string name = 1;
  string input_path = 2;
  string output_path = 3;
  // If > 0 and the submission is not accepted on this case, Result.feedback
  // is set, containing at most this many bytes of each of the submission's
  // standard output and standard error.
  // Has no effect for interactive evaluations.
  int32 feedback_limit_bytes = 4;
}

enum Verdict {
  VERDICT_UNSPECIFIED = 0;
  ACCEPTED = 1;
  TIME_LIMIT_EXCEEDED = 2;
  WRONG_ANSWER = 3;
  RUN_TIME_ERROR = 4;
}

enum ResultType {
  RESULT_TYPE_UNSPECIFIED = 0;
  TEST_CASE = 1;
  TEST_GROUP = 2;
}

// Details about a rejected run of a test case, see
// TestCase.feedback_limit_bytes.
message CaseFeedback {
  // The name of the test case that the feedback is for.
  string case_name = 1;
  // A prefix of what the submission wrote to standard output.
  bytes team_output = 2;
  // Whether the output was longer than what team_output contains.
  bool team_output_truncated = 3;
  // A prefix of what the submission wrote to standard error.
  bytes team_error = 4;
  // Whether the error output was longer than what team_error contains.
  bool team_error_truncated = 5;
  // Only meaningful for the verdict RUN_TIME_ERROR: if signal is non-zero the
  // submission was killed by that signal, otherwise exit_code is its
  // (non-zero) exit code.
  int32 exit_code = 6;
  int32 signal = 7;
}

message Result {
  ResultType type = 1;
  Verdict verdict = 2;
  double score = 3;
  int64 time_usage_ms = 4;
  string message = 5;
  // Only set for rejected test cases with feedback_limit_bytes set.
  CaseFeedback feedback = 6;
}
